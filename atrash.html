<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الأطرش في الزفة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;800&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{--n:#14284B;--r:#B3261E;--g:#F2B22C;--gr:#0F6B4F;--c:#FFF4DC;--i:#1B1B1B}
*{box-sizing:border-box}
body{margin:0;background:var(--n);color:#fff;font:500 17px/1.65 Cairo,Tahoma,sans-serif;min-height:100vh}
.band{height:18px;background:repeating-linear-gradient(45deg,var(--r) 0 12px,var(--g) 12px 18px,var(--gr) 18px 30px,var(--c) 30px 34px)}
.flags{height:30px;background:conic-gradient(from 150deg at 50% 100%,var(--g) 60deg,#0000 0) 0 0/40px 30px,conic-gradient(from -30deg at 50% 0,var(--r) 60deg,#0000 0) 20px 0/40px 30px}
main{max-width:460px;margin:auto;padding:8px 18px 40px;display:flex;flex-direction:column;gap:12px}
h1,h2,.big{font-family:Lalezar,Cairo,sans-serif;font-weight:400;text-align:center;color:var(--g);margin:0;line-height:1.5}
h1{font-size:42px}h2{font-size:32px}.big{font-size:26px}
p{margin:0;text-align:center}
.box{background:var(--c);color:var(--i);border:4px solid var(--g);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.q{background:var(--g);color:var(--i);border:2px solid var(--i);border-radius:20px;padding:10px 14px;font:24px/1.6 Lalezar,Cairo,sans-serif;text-align:center}
button,input,select{font:inherit;border-radius:12px;min-height:48px;border:2px solid var(--i)}
button{cursor:pointer;background:var(--g);color:var(--i);font:22px Lalezar,Cairo,sans-serif;padding:4px 16px}
button:disabled{opacity:.45;cursor:default}
button.alt{background:var(--r);color:#fff}
input,select{width:100%;padding:0 12px;background:#fff;color:var(--i)}
.row{display:flex;gap:8px;align-items:center}.row>input{flex:1;min-width:0}
.card{background:#fff;color:var(--i);border:2px solid var(--i);border-radius:14px;padding:8px 12px}
.card small{color:#555;display:block}.card b{font-size:20px;overflow-wrap:anywhere}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.picks button{font-size:17px;min-height:44px;background:#eee}
.picks button[aria-pressed=true]{background:var(--r);color:#fff}
.timer{align-self:center;background:var(--r);border:3px solid var(--c);border-radius:40px;padding:0 20px;font:26px Lalezar,sans-serif}
.err{color:#FFD0C8;min-height:1.6em}
ul{margin:0;padding-inline-start:20px}
.code{font:44px Lalezar,sans-serif;letter-spacing:8px;text-align:center;direction:ltr}
.off{opacity:.45}.red{color:var(--r)}.box p{color:inherit}
.home{display:block;max-width:460px;margin:8px auto 0;padding:0 18px;color:var(--g);font-weight:800;text-decoration:none}
#net{color:var(--g);text-align:center;min-height:1.6em}
</style>
</head>
<body>
<div class="band"></div><div class="flags"></div>
<a class="home" href="index.html">🏠 كل الألعاب</a>
<div id="net" role="status"></div>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
<script>
const Q=[
["إيه أحسن حيوان تربيه في البيت؟","إيه أطعم حيوان في الأكل؟"],
["أكلة نفسك فيها دلوقتي؟","أكلة مستحيل تدوقها تاني؟"],
["تروح فين في إجازة الصيف؟","تروح فين لو عايز تستخبى من الديّانة؟"],
["حاجة بتاخدها معاك البحر؟","حاجة بتاخدها معاك الامتحان؟"],
["أحلى مشروب في الشتا؟","أحلى مشروب في الصيف؟"],
["حاجة بتعملها أول ما تصحى؟","حاجة بتعملها قبل ما تنام؟"],
["هدية تجيبها لصاحبك؟","هدية تجيبها لحماتك؟"],
["حاجة تلاقيها في المطبخ؟","حاجة تلاقيها في الحمّام؟"],
["أكتر حاجة بتفرّحك؟","أكتر حاجة بتعصّبك؟"],
["حاجة بتتقال في الفرح؟","حاجة بتتقال في الخناقة؟"],
["أحسن أكلة على الفطار؟","أحسن أكلة على السحور؟"],
["كام ساعة بتنام في اليوم؟","كام ساعة بتمسك الموبايل في اليوم؟"],
["محافظة نفسك تزورها؟","محافظة نفسك تعيش فيها؟"],
["حاجة بتشتريها من السوبر ماركت؟","حاجة بتشتريها من الصيدلية؟"],
["حلويات بتحبها؟","حلويات بتتعمل في العيد؟"],
["وسيلة مواصلات بتحبها؟","وسيلة مواصلات بتكرهها؟"],
["شغلانة كان نفسك فيها وإنت صغير؟","شغلانة مستحيل تشتغلها؟"],
["حاجة بتخاف منها؟","حاجة بتقرف منها؟"],
["بتعمل إيه لو النور قطع؟","بتعمل إيه لو النت فصل؟"],
["كام جنيه تكفيك في خروجة؟","كام جنيه تديها عيدية؟"],
["حاجة بتتاكل بالعيش؟","حاجة بتتاكل بالمعلقة؟"],
["لعبة كنت بتلعبها في الشارع؟","لعبة بتلعبها على الموبايل؟"],
["أول حاجة تعملها لو كسبت مليون جنيه؟","أول حاجة تعملها لو خسرت كل فلوسك؟"],
["فاكهة صيفي بتحبها؟","فاكهة شتوي بتحبها؟"]];
const BROKER=window.TEST_BROKER||'wss://broker.emqx.io:8084/mqtt', PREFIX='atrash-m4x9/';
const TIMES=Object.assign({answer:45,vote:90},window.TEST_TIMES);
const app=document.getElementById('app');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function el(tag,props={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(props)){if(k.startsWith('on'))e[k]=v;else if(k==='class')e.className=v;else e.setAttribute(k,v)}e.append(...kids.flat().filter(x=>x!=null&&x!==false));return e}
const H=t=>el('h2',{},t), P=t=>el('p',{},t), B=(t,f,c='')=>el('button',{type:'button',class:c,onclick:f},t);
const show=(...n)=>app.replaceChildren(...n.flat().filter(Boolean));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const rid=()=>Math.random().toString(36).slice(2,10);
let me=store.get('at-id');if(!me){me=rid();store.set('at-id',me)}
let client,code='',isHost=false,S=null,V=null,last='',lastSeen=0,endAt=0,draft='',round=0,sentFor=0;
const net=t=>document.getElementById('net').textContent=t;

/* الاتصال */
function connect(topic,onMsg,onReady){
 if(typeof mqtt==='undefined')return net('تعذر تحميل مكتبة الاتصال، اتأكد من النت وحدّث الصفحة');
 net('جاري الاتصال…');
 client=mqtt.connect(BROKER,{clientId:'at_'+me+rid(),reconnectPeriod:2000});
 client.on('connect',()=>{net('');client.subscribe(topic,onReady)});
 client.on('message',(t,m)=>{try{onMsg(JSON.parse(m.toString()))}catch(e){console.error(e)}});
 client.on('reconnect',()=>net('بنعيد الاتصال…'));
}
const pub=(t,d)=>client&&client.publish(PREFIX+code+'/'+t,JSON.stringify(d));
const send=a=>{a.id=me;isHost?handle(a):pub('up',a)};

/* صاحب القعدة هو اللي بيدير اللعبة */
const online=i=>i===me||Date.now()-S.p[i].seen<15000;
const playing=()=>S.in.filter(online);
function startRound(){
 const ids=S.order.filter(online).slice(0,10);
 if(ids.length<3){S.phase='lobby';return}
 if(!S.deck.length)S.deck=shuffle(Q);
 S.pair=S.deck.pop();if(Math.random()<.5)S.pair=[S.pair[1],S.pair[0]];
 S.in=ids;S.deaf=ids[Math.random()*ids.length|0];S.ans={};S.votes={};S.r++;
 S.phase='answer';S.end=Date.now()+TIMES.answer*1000;
}
function reveal(){S.shown=shuffle(S.in);S.in.forEach(i=>{if(!(i in S.ans))S.ans[i]='(ملحقش يجاوب)'});S.phase='talk'}
function result(){
 const count={};S.in.forEach(i=>count[i]=0);Object.values(S.votes).forEach(j=>count[j]++);
 const top=Math.max(...Object.values(count));
 S.caught=top>0&&count[S.deaf]===top&&Object.values(count).filter(c=>c===top).length===1;
 S.in.forEach(i=>{if(S.caught&&i!==S.deaf)S.p[i].score++;if(!S.caught&&i===S.deaf)S.p[i].score+=2});
 S.count=count;S.phase='result';
}
function advance(){
 const now=Date.now();
 if(S.phase==='answer'){const a=playing();if((a.length&&a.every(i=>i in S.ans))||now>S.end+2500)reveal()}
 else if(S.phase==='vote'&&now>S.end+1000)result();
}
function handle(a){
 if(!S||typeof a.id!=='string'||!/^[a-z0-9]{4,12}$/.test(a.id))return;
 let p=S.p[a.id];
 if(a.type==='hello'){
  let name=String(a.name||'').trim().slice(0,14)||'لاعب';
  if(!p){
   if(S.order.length>=10){const gone=S.order.find(i=>!online(i)&&(S.phase==='lobby'||!S.in.includes(i)));
    if(!gone)return pub('to/'+a.id,{full:true});S.order=S.order.filter(i=>i!==gone);delete S.p[gone]}
   const base=name;for(let n=2;S.order.some(i=>S.p[i].n===name);n++)name=base+' '+n;
   p=S.p[a.id]={n:name,score:0};S.order.push(a.id);
  }
  p.seen=Date.now();
 }
 if(!p)return;
 p.seen=Date.now();
 const host=a.id===me,inside=S.in.includes(a.id),now=a.round===S.r;
 if(a.type==='start'&&host&&S.phase==='lobby'&&S.order.filter(online).length>=3){
  S.rounds=[3,5,7,10].includes(a.rounds)?a.rounds:5;S.r=0;S.order.forEach(i=>S.p[i].score=0);startRound()}
 if(a.type==='answer'&&S.phase==='answer'&&inside&&now){const v=String(a.v||'').trim().slice(0,40);if(v&&!(a.id in S.ans))S.ans[a.id]=v}
 if(a.type==='tovote'&&host&&S.phase==='talk'){S.phase='vote';S.end=Date.now()+TIMES.vote*1000}
 if(a.type==='vote'&&S.phase==='vote'&&inside&&now&&a.to!==a.id&&S.in.includes(a.to))S.votes[a.id]=a.to;
 if(a.type==='result'&&host&&S.phase==='vote'&&playing().every(i=>i in S.votes))result();
 if(a.type==='next'&&host&&S.phase==='result'){if(S.r<S.rounds)startRound();else S.phase='end'}
 if(a.type==='skip'&&host&&S.phase!=='lobby'){if(S.phase!=='result')S.r--;startRound()}
 if(a.type==='lobby'&&host)S.phase='lobby';
 sync();
}
function viewFor(id){
 const ph=S.phase,inside=S.in.includes(id),open=ph==='talk'||ph==='vote'||ph==='result';
 return {you:id,host:me,phase:ph,r:S.r,rounds:S.rounds,inside,
  players:S.order.map(i=>({id:i,n:S.p[i].n,score:S.p[i].score,on:online(i),
   done:ph==='answer'?i in S.ans:ph==='vote'?i in S.votes:false})),
  q:ph==='answer'&&inside?S.pair[id===S.deaf?1:0]:open?S.pair[0]:null,
  answers:open?S.shown.map(i=>({id:i,n:S.p[i]?S.p[i].n:'',a:S.ans[i]})):null,
  mine:ph==='answer'?S.ans[id]??null:null,vote:ph==='vote'?S.votes[id]??null:null,
  res:ph==='result'?{deaf:S.deaf,q:S.pair[1],caught:S.caught,count:S.count}:null,
  left:ph==='answer'||ph==='vote'?Math.max(0,S.end-Date.now()):0};
}
function sync(){
 advance();
 store.set('at-room',JSON.stringify({code,S}));
 S.order.forEach(i=>{if(i!==me)pub('to/'+i,viewFor(i))});
 update(viewFor(me));
}
function host(name,saved){
 isHost=true;
 if(saved){code=saved.code;S=saved.S}
 else{code=Array.from({length:5},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.random()*31|0]).join('');S={phase:'lobby',p:{},order:[],in:[],deck:[],r:0,rounds:5}}
 connect(PREFIX+code+'/up',handle,()=>handle({type:'hello',id:me,name}));
 let beat=0;setInterval(()=>{if(!S.p[me])return;const before=S.phase;advance();if(S.phase!==before||++beat%4===0)sync()},1000);
}
function join(name,c){
 code=c;const hello=()=>pub('up',{type:'hello',id:me,name});
 connect(PREFIX+code+'/to/'+me,v=>{lastSeen=Date.now();if(v.full)return net('القعدة كاملة (١٠ لاعيبة)');net('');update(v)},hello);
 const t0=Date.now();
 setInterval(()=>{hello();if(Date.now()-(lastSeen||t0)>12000)net('مفيش رد من صاحب القعدة. اتأكد من الكود وإن صفحته مفتوحة')},4000);
}

/* الشاشات */
const how=()=>el('details',{},el('summary',{},'إزاي نلعب؟'),el('ul',{},[
 'كل دور واحد بيبقى «الأطرش» وبيجيله سؤال شبه سؤال الباقيين، وهو مش دريان.',
 'كل واحد يجاوب من موبايله في السر قبل ما الوقت يخلص.',
 'الإجابات بتظهر ملخبطة، اتناقشوا وصوّتوا على اللي شاكين فيه.',
 'لو الأطرش لوحده خد أعلى أصوات، كل واحد من الباقيين ياخد نقطة. غير كده الأطرش ياخد نقطتين.'].map(t=>el('li',{},t))));
function home(){
 const name=el('input',{maxlength:14,placeholder:'اسمك','aria-label':'اسمك'});name.value=store.get('tr-name')||'';
 const room=el('input',{maxlength:5,placeholder:'كود القعدة','aria-label':'كود القعدة'});room.value=location.hash.slice(1).toUpperCase();
 const go=f=>{const n=name.value.trim();if(!n){name.focus();return net('اكتب اسمك الأول')}store.set('tr-name',n);show(P('لحظة…'));f(n)};
 let saved=null;try{saved=JSON.parse(store.get('at-room'))}catch(e){}
 show(el('h1',{},'الأطرش في الزفة'),P('كل واحد من موبايله، من ٣ لـ ١٠ لاعيبة'),name,
  B('افتح قعدة جديدة',()=>go(n=>host(n))),room,
  B('خش على القعدة',()=>{const c=room.value.trim().toUpperCase();if(c.length!==5)return net('الكود ٥ حروف');go(n=>join(n,c))},'alt'),
  saved&&saved.S&&B('ارجع لقعدتي ('+saved.code+')',()=>go(n=>host(n,saved))),how());
}
function update(v){
 endAt=Date.now()+v.left;
 const j=JSON.stringify({...v,left:0});if(j===last)return;last=j;V=v;
 if(v.r!==round){round=v.r;draft='';sentFor=0}
 const focus=document.activeElement&&document.activeElement.id==='ans';
 const y=scrollY,ph=app.dataset.ph;app.dataset.ph=v.phase+v.r;
 render();
 if(focus&&document.getElementById('ans'))document.getElementById('ans').focus();
 scrollTo(0,ph===app.dataset.ph?y:0);
}
function sendAnswer(){if(draft.trim())send({type:'answer',v:draft,round:V.r})}
setInterval(()=>{
 if(!V)return;const l=Math.max(0,Math.ceil((endAt-Date.now())/1000)),t=document.getElementById('timer');if(t)t.textContent=l;
 if(V.phase==='answer'&&V.inside&&V.mine==null&&l<=1&&sentFor!==V.r&&draft.trim()){sentFor=V.r;sendAnswer()}
},250);
function render(){
 const v=V,isH=v.you===v.host,name=i=>(v.players.find(p=>p.id===i)||{}).n||'لاعب';
 const timer=()=>el('div',{class:'timer',role:'timer',id:'timer'},Math.ceil((endAt-Date.now())/1000));
 const answers=()=>el('div',{class:'box'},v.answers.map(x=>el('div',{class:'card'},el('small',{},x.n),el('b',{},x.a))));
 const status=()=>el('div',{class:'box'},v.players.map(p=>el('div',{class:'card'+(p.on?'':' off')},(p.done?'✅ ':'⏳ ')+p.n)));
 const hostBtns=()=>isH?[B('تخطّي الدور',()=>send({type:'skip'}),'alt'),B('رجوع للقعدة',()=>send({type:'lobby'}),'alt')]:[];
 if(v.phase==='lobby'){
  const link=location.protocol.startsWith('http')?location.href.split('#')[0]+'#'+code:null;
  const sel=el('select',{'aria-label':'عدد الأدوار'},[3,5,7,10].map(n=>el('option',{value:n},n+' أدوار')));sel.value=v.rounds;sel.onchange=()=>{S.rounds=+sel.value;sync()};
  const n=v.players.filter(p=>p.on).length,start=B('يلا نلعب',()=>send({type:'start',rounds:+sel.value}));start.disabled=n<3;
  return show(el('h1',{},'الأطرش في الزفة'),el('div',{class:'box'},P('كود القعدة'),el('div',{class:'code'},code),
   link&&B('انسخ لينك الدعوة',e=>{const b=e.target;navigator.clipboard.writeText(link).then(()=>b.textContent='اتنسخ ✅',()=>b.textContent=link)})),
   el('div',{class:'box'},v.players.map(p=>el('div',{class:'card'+(p.on?'':' off')},p.n+(p.id===v.you?' (إنت)':'')+(p.id===v.host?' ⭐':'')))),
   isH?[sel,start,n<3&&P('محتاجين ٣ لاعيبة على الأقل')]:P('مستنيين صاحب القعدة يبدأ'),how());
 }
 if(v.phase==='end'){
  const rank=[...v.players].sort((a,b)=>b.score-a.score),win=rank.filter(p=>p.score===rank[0].score).map(p=>p.n);
  return show(el('h1',{},'مبروك يا معلّم!'),el('div',{class:'big'},(win.length>1?'تعادل: ':'الكسبان: ')+win.join(' و ')),
   el('div',{class:'box'},rank.map(p=>el('div',{class:'card'},`${p.n}: ${p.score} نقطة`))),isH?B('العبوا تاني',()=>send({type:'lobby'})):P('مستنيين صاحب القعدة'));
 }
 const title=H(`الدور ${v.r} من ${v.rounds}`);
 if(!v.inside&&v.phase!=='result')return show(title,P('الدور شغال، هتدخل من الدور اللي بعده'),hostBtns());
 if(v.phase==='answer'){
  if(v.mine!=null)return show(title,timer(),el('div',{class:'q'},v.q),P('إجابتك: '+v.mine),P('مستنيين الباقيين…'),status(),hostBtns());
  const inp=el('input',{id:'ans',maxlength:40,placeholder:'اكتب إجابتك هنا…','aria-label':'إجابتك',autocomplete:'off'});
  inp.value=draft;inp.oninput=()=>draft=inp.value;inp.onkeydown=e=>{if(e.key==='Enter')sendAnswer()};
  return show(title,timer(),P('ده سؤالك، ماتوريهوش لحد!'),el('div',{class:'q'},v.q),inp,B('ابعت',()=>draft.trim()?sendAnswer():inp.focus()),status(),hostBtns());
 }
 if(v.phase==='talk')return show(H('الكشف والرغي'),el('div',{class:'q'},v.q),answers(),P('مين إجابته برّه الليلة خالص؟ اتناقشوا!'),
  isH?B('يلا نصوّت',()=>send({type:'tovote'})):P('صاحب القعدة هيفتح التصويت'),hostBtns());
 if(v.phase==='vote'){
  const picks=el('div',{class:'picks'},v.answers.filter(x=>x.id!==v.you).map(x=>{const b=B(x.n,()=>send({type:'vote',to:x.id,round:v.r}));b.setAttribute('aria-pressed',v.vote===x.id);return b}));
  const done=B('اكشفوا الأطرش',()=>send({type:'result'}));done.disabled=!v.players.filter(p=>p.on&&v.answers.some(x=>x.id===p.id)).every(p=>p.done);
  return show(H('التصويت'),timer(),el('div',{class:'q'},v.q),answers(),el('div',{class:'card'},el('b',{},'إنت شاكك في مين؟'),picks),
   P('تقدر تغيّر صوتك لحد ما الوقت يخلص'),status(),isH&&done,hostBtns());
 }
 const r=v.res,deafAns=v.answers.find(x=>x.id===r.deaf);
 show(H(r.caught?'اتقفش الأطرش!':'الأطرش فلت!'),el('div',{class:'box'},el('div',{class:'big red'},'الأطرش كان: '+name(r.deaf)+(r.deaf===v.you?' (إنت!)':'')),
  P('سؤاله كان:'),el('div',{class:'q'},r.q),P('إجابته: '+(deafAns?deafAns.a:'')),P(r.caught?'كل واحد من الباقيين خد نقطة':'خد نقطتين لوحده')),
  el('div',{class:'box'},v.players.map(p=>el('div',{class:'card'},`${p.n}: ${p.score} نقطة — أصوات عليه: ${r.count[p.id]||0}`))),
