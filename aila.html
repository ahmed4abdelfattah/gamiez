 const who=g.myTurn?'دورك!':'دور '+g.turn;
 let act=[];
 if(ph==='ready')act=boss?[P('اقرا السؤال، وبعدين افتح الجرس'),B('🔔 اعرض السؤال وافتح الجرس',()=>send({type:'open'}),'gold big')]:[P('المقدّم بيجهّز السؤال…')];
 else if(ph==='buzz')act=[T('h3',`⚔️ ${g.duel[0]} ضد ${g.duel[1]}`),g.inDuel?B('🔔',()=>send({type:'buzz'}),'buzzer'):P('استنوا مين هيدوس الأول…')];
 else if(ph==='choose')act=[T('h3',TEAMS[g.ctrl]+' كسبت التحكم 💪'),g.iCap&&v.t===g.ctrl||H?el('div',{class:'row'},B('▶️ نلعب',()=>send({type:'choose',play:true}),'gold big'),B('↪️ نمرر',()=>send({type:'choose',play:false}),'big')):P(`القائد ${g.capName} بيقرر: لعب ولا تمرير؟`)];
 else if(['face','play','steal'].includes(ph)){
  act=[ph==='steal'&&T('h3',`🥷 فرصة سرقة: ${TEAMS[1-g.ctrl]}`),T('h2',ph==='steal'?(g.myTurn?'انت القائد: قول إجابة واحدة':`القائد ${g.turn} هيجاوب`):who,g.myTurn?'mine':''),
   g.timed&&el('div',{id:'timer',class:'timer'}),
   g.myTurn&&input(boss?'':v.set.judge==='host'?'قولها بصوتك أو اكتبها':'اكتب إجابتك','ans'),
   ph==='play'&&!g.myTurn&&v.t===g.ctrl&&P('🤫 من غير تشاور'),
   g.sugg&&el('div',{class:'panel'},P('تشاوروا: اقتراحاتكم باينة لعيلتكم بس'),g.sugg.map(x=>T('div',x.name+': '+x.text,'who')),!g.myTurn&&!boss&&input('اقترح على القائد','sugg')),
   boss&&el('div',{class:'panel'},P('دوس على الإجابة الصح في اللوحة، أو:'),B('✖ إجابة غلط',()=>send({type:'judge',i:-1}),'red big'))];
 }else if(ph==='roundEnd'){
  const r=g.result;act=[T('h2',`${r.why} ${TEAMS[r.team]} خدت ${r.points} نقطة`),H?B('التالي ⬅',()=>send({type:'next'}),'gold big'):P('مستنيين صاحب القعدة…')];
 }
 const s=g.said;
 screen(top,T('div',`الجولة ${g.round}${g.round>4?' (فاصلة)':''} · النقط ×${g.mult}`,'round'),
  T('div',g.q||'؟؟؟','question'),
  s&&T('div',s.dup?`${s.name}: «${s.text}» اتقالت قبل كده، قول غيرها`:s.wait?`${s.name}: «${s.text}»`:`${s.ok?'✅':'❌'} ${s.name}${s.text?': «'+s.text+'»':''}`,'said t'+s.team),
  board,
  g.ctrl!=null&&['play','steal'].includes(ph)&&T('div',[0,1,2].map(i=>i<g.strikes?'✖':'○').join(' '),'strikes'),
  el('div',{class:'stage'},act),
  H&&el('div',{class:'row'},g.canUndo&&B('↩️ تراجع',()=>send({type:'undo'}),'ghost sm'),
   ['buzz','face','play'].includes(ph)&&B('⏭️ عدّي اللاعب',()=>send({type:'skip'}),'ghost sm'),
   ['ready','buzz'].includes(ph)&&B('🔀 سؤال تاني',()=>send({type:'change'}),'ghost sm')),quit);
}
home();
</script>
