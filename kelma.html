<style>
*{box-sizing:border-box}
body{margin:0;background:#12233f radial-gradient(circle at 50% 0,#2b4a7a,#0000 65%);color:#fff;font:600 16px/1.6 Cairo,Tahoma,sans-serif;min-height:100vh}
main{max-width:460px;margin:auto;padding:4px 14px 32px;display:flex;flex-direction:column;gap:10px}
h1{font:400 46px/1.5 Lalezar,Cairo,sans-serif;color:#ffc83d;text-align:center;margin:0}p{margin:0;text-align:center}
.home{display:block;max-width:460px;margin:8px auto 0;padding:0 14px;color:#ffc83d;font-weight:800;text-decoration:none}
#net{color:#ffc83d;text-align:center;min-height:1.6em}
button,input,select{font:inherit;border:0;border-radius:12px;min-height:48px}
input,select{width:100%;padding:0 12px;background:#fff;color:#12233f;text-align:center}
button{cursor:pointer;background:#ffc83d;color:#12233f;font-weight:800;padding:4px 14px}
button.alt{background:#e83e72;color:#fff}button.ghost{background:#ffffff22;color:#fff}button:disabled{opacity:.45;cursor:default}
.box{background:#ffffff14;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.code{font:44px Lalezar,sans-serif;letter-spacing:8px;text-align:center;direction:ltr}
.players{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.pl{background:#ffffff1c;border-radius:20px;padding:2px 12px}.pl.now{background:#ffc83d;color:#12233f}.off{opacity:.45}
.bar{display:flex;justify-content:space-between;align-items:center;font:28px Lalezar,Cairo,sans-serif}.timer{background:#e83e72;border-radius:30px;min-width:64px;text-align:center}
.msg{text-align:center;background:#00000040;border-radius:12px;padding:6px;min-height:40px}
.table{display:flex;justify-content:center;gap:10px;background:#0b1a30;border:3px solid #7a4a24;border-radius:20px;padding:18px 8px}
.hand{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button.card{position:relative;width:68px;height:96px;padding:0;color:#fff;border:3px solid #ffffff55;display:flex;align-items:center;justify-content:center}
button.card b{font:400 44px Lalezar,Cairo,sans-serif;text-shadow:0 3px 0 #0005}
button.card small{position:absolute;top:2px;right:7px;font:800 17px Cairo,sans-serif}
button.card.big{width:92px;height:128px;opacity:1}button.card.big b{font-size:60px}
button.card.picked{border-color:#fff;box-shadow:0 0 0 4px #ffc83d;transform:translateY(-6px)}
.c0{background:#7048c6}.c1{background:#e83e72}.c2{background:#e98a00}.c3{background:#168f8a}.c4{background:#2f6fd0}
button.card.joker{background:conic-gradient(#7048c6 25%,#e83e72 0 50%,#e98a00 0 75%,#168f8a 0)}
.row{display:flex;gap:8px}.row>button{flex:1}
.abc{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}.abc button{min-height:38px;padding:0;background:#fff}.abc button.on{background:#e83e72;color:#fff}
ul{margin:0;padding-inline-start:20px}
</style>

const BROKER=window.TEST_BROKER||'wss://broker.emqx.io:8084/mqtt', PREFIX='kelma-r8d2/';
const FUS=new Set(WORDS[0].split(' ')), EGY=new Set(WORDS[1].split(' '));
const START='قلم كلب بيت شمس قمر ولد درس بحر جمل ورد نهر باب عين نور فول عيش سهم ملح حبل تين موز دور ليل يوم فيل'.split(' ');
const LETTERS='ء آ أ إ ؤ ئ ا ب ة ت ث ج ح خ د ذ ر ز س ش ص ض ط ظ ع غ ف ق ك ل م ن ه و ي ى'.split(' ');
/* عدد مرات ظهور كل حرف على أوجه الكروت */
const COUNTS={'ا':14,'ل':13,'م':13,'ر':13,'ن':11,'ب':11,'و':11,'ي':11,'ع':9,'د':9,'س':8,'ف':8,'ه':8,'ق':8,'ت':7,'ح':7,'ك':7,'أ':7,'ج':6,'ش':5,'ط':5,'خ':4,'ص':4,'ز':4,'غ':3,'ض':3,'ة':3,'ث':2,'ذ':2,'ى':2,'ظ':1,'ء':1,'ئ':1,'إ':1,'آ':1,'ؤ':1};
const HAND=7, JOKERS=5, MAXP=8;
const app=document.getElementById('app');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function el(tag,props={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(props)){if(k.startsWith('on'))e[k]=v;else if(k==='class')e.className=v;else e.setAttribute(k,v)}e.append(...kids.flat().filter(x=>x!=null&&x!==false));return e}
const P=t=>el('p',{},t), B=(t,f,c='',off=false)=>{const b=el('button',{type:'button',class:c,onclick:f},t);b.disabled=off;return b};
const show=(...n)=>app.replaceChildren(...n.flat().filter(Boolean));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const rid=()=>Math.random().toString(36).slice(2,10);
let me=store.get('kk-id');if(!me){me=rid();store.set('kk-id',me)}
let client,code='',isHost=false,S=null,V=null,last='',lastSeen=0,endAt=0;
let sel=null,pos=null,joker=null,flipped={};
const net=t=>document.getElementById('net').textContent=t;

/* الاتصال */
function connect(topic,onMsg,onReady){
 if(typeof mqtt==='undefined')return net('تعذر تحميل مكتبة الاتصال، اتأكد من النت وحدّث الصفحة');
 net('جاري الاتصال…');
 client=mqtt.connect(BROKER,{clientId:'kk_'+me+rid(),reconnectPeriod:2000});
 client.on('connect',()=>{net('');client.subscribe(topic,onReady)});
 client.on('message',(t,m)=>{try{onMsg(JSON.parse(m.toString()))}catch(e){console.error(e)}});
 client.on('reconnect',()=>net('بنعيد الاتصال…'));
}
const pub=(t,d)=>client&&client.publish(PREFIX+code+'/'+t,JSON.stringify(d));
const send=a=>{a.id=me;isHost?handle(a):pub('up',a)};

/* منطق اللعبة (على موبايل صاحب القعدة) */
const valid=w=>FUS.has(w)||(S.egy&&EGY.has(w));
const online=i=>i===me||Date.now()-S.p[i].seen<15000;
function makeDeck(){
 let faces=shuffle(Object.entries(COUNTS).flatMap(([l,n])=>Array(n).fill(l)));
 const cards=[];let id=1;
 while(faces.length>1){const a=faces.pop();let j=faces.length-1;while(j>=0&&faces[j]===a)j--;if(j<0)break;cards.push({id:id++,f:[a,faces.splice(j,1)[0]]})}
 return shuffle(cards);
}
function draw(pid){
 if(!S.deck.length){S.deck=shuffle(S.used);S.used=[]}
 const c=S.deck.pop();if(c)S.p[pid].hand.push(c);return c;
}
function startGame(){
 const ids=S.order.filter(online).slice(0,MAXP);if(ids.length<2)return;
 S.in=ids;S.used=[];S.deck=makeDeck();
 ids.forEach(i=>{S.p[i].hand=[];for(let k=0;k<HAND;k++)draw(i)});
 /* الجواكر في الكروت اللي بره بس */
 for(let k=0;k<JOKERS;k++)S.deck.splice(Math.random()*(S.deck.length+1)|0,0,{id:1000+k,joker:true});
 const w=START[Math.random()*START.length|0];S.word=[...w];S.center=[null,null,null];S.history=[w];
 S.turn=0;S.n=0;S.phase='play';S.msg='يلا بينا! الكلمة الأولى: '+w;S.reject=null;S.winner=null;newTurn();
}
function newTurn(){S.n++;S.end=Date.now()+S.time*1000}
function nextTurn(){
 for(let k=1;k<=S.in.length;k++){const i=(S.turn+k)%S.in.length;if(online(S.in[i])){S.turn=i;break}}
 newTurn();
}
function apply(pid,card,at,letter){
 const hand=S.p[pid].hand,i=hand.findIndex(c=>c.id===card.id);if(i<0)return;
 hand.splice(i,1);if(S.center[at])S.used.push(S.center[at]);S.center[at]=card;S.word[at]=letter;
 S.history.push(S.word.join(''));S.reject=null;
 if(!hand.length){S.phase='end';S.winner=pid}
}
function advance(){
 if(!S||S.phase!=='play')return;
 const pid=S.in[S.turn];
 if(Date.now()<=S.end+1200)return;
 if(online(pid)){draw(pid);S.msg='⏰ '+S.p[pid].n+' الوقت خلص وسحب كارت'}else S.msg=S.p[pid].n+' مش متصل، دوره اتعدّى';
 nextTurn();
}
function handle(a){
 if(!S||typeof a.id!=='string'||!/^[a-z0-9]{4,12}$/.test(a.id))return;
 let p=S.p[a.id];
 if(a.type==='hello'){
  let name=String(a.name||'').trim().slice(0,14)||'لاعب';
  if(!p){
   if(S.order.length>=MAXP){const gone=S.order.find(i=>!online(i)&&(S.phase==='lobby'||!S.in.includes(i)));
    if(!gone)return pub('to/'+a.id,{full:true});S.order=S.order.filter(i=>i!==gone);delete S.p[gone]}
   const base=name;for(let n=2;S.order.some(i=>S.p[i].n===name);n++)name=base+' '+n;
   p=S.p[a.id]={n:name,hand:[],wins:0};S.order.push(a.id);
  }
  p.seen=Date.now();
 }
 if(!p)return;
 p.seen=Date.now();
 const host=a.id===me;
 advance();
 const myTurn=S.phase==='play'&&S.in[S.turn]===a.id&&a.n===S.n;
 if(a.type==='settings'&&host&&S.phase==='lobby'){if([10,15,20,30,45,60].includes(a.time))S.time=a.time;S.egy=!!a.egy}
 if(a.type==='start'&&host&&S.phase==='lobby')startGame();
 if(a.type==='play'&&myTurn){
  const card=p.hand.find(c=>c.id===a.card),at=a.at;
  if(card&&[0,1,2].includes(at)){
   const letter=card.joker?a.letter:card.f[a.side===1?1:0];
   if(LETTERS.includes(letter)&&letter!==S.word[at]){
    const w=[...S.word];w[at]=letter;const word=w.join('');
    if(valid(word)){apply(a.id,card,at,letter);S.msg='✅ '+p.n+' كتب «'+word+'»'}
    else{const d=draw(a.id);S.reject={pid:a.id,card,at,letter,word,base:S.word.join(''),drawn:d&&d.id};S.msg='❌ «'+word+'» مش في القاموس، '+p.n+' سحب كارت'}
    if(S.phase==='play')nextTurn();
   }
  }
 }
 if(a.type==='draw'&&myTurn){draw(a.id);S.msg=p.n+' سحب كارت';nextTurn()}
 /* صاحب القعدة يقدر يقبل كلمة صح القاموس رفضها */
 if(a.type==='accept'&&host&&S.phase==='play'&&S.reject){
  const r=S.reject,q=S.p[r.pid];
  if(q&&r.base===S.word.join('')){
   const i=q.hand.findIndex(c=>c.id===r.drawn);if(i>=0)S.deck.push(...q.hand.splice(i,1));
   apply(r.pid,r.card,r.at,r.letter);S.msg='👌 صاحب القعدة قبل «'+r.word+'»';
  }
 }
 if(a.type==='skip'&&host&&S.phase==='play'){S.msg='صاحب القعدة عدّى الدور';nextTurn()}
 if(a.type==='lobby'&&host)S.phase='lobby';
 if(a.type==='hello'&&S.phase==='end'){}
 sync();
}
function viewFor(id){
 const playing=S.phase!=='lobby';
 return {you:id,host:me,phase:S.phase,time:S.time,egy:S.egy,
  players:S.order.map(i=>({id:i,n:S.p[i].n,on:online(i),in:S.in.includes(i),cards:S.p[i].hand.length})),
  word:playing?S.word:null,turn:playing?S.in[S.turn]:null,n:S.n,msg:playing?S.msg:'',
  hand:playing&&S.in.includes(id)?S.p[id].hand:null,
  reject:S.phase==='play'&&S.reject&&S.reject.base===S.word.join('')&&id===me?S.reject.word:null,
  deck:playing?S.deck.length:0,winner:S.winner,left:S.phase==='play'?Math.max(0,S.end-Date.now()):0};
}
function sync(){
 store.set('kk-room',JSON.stringify({code,S}));
 S.order.forEach(i=>{if(i!==me)pub('to/'+i,viewFor(i))});
 update(viewFor(me));
}
function host(name,saved){
 isHost=true;
 if(saved){code=saved.code;S=saved.S}
 else{code=Array.from({length:5},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.random()*31|0]).join('');S={phase:'lobby',p:{},order:[],in:[],time:30,egy:true,n:0}}
 connect(PREFIX+code+'/up',handle,()=>handle({type:'hello',id:me,name}));
 let beat=0;setInterval(()=>{if(!S.p[me])return;const n=S.n;advance();if(S.n!==n||++beat%8===0)sync()},500);
}
function join(name,c){
 code=c;const hello=()=>pub('up',{type:'hello',id:me,name});
 connect(PREFIX+code+'/to/'+me,v=>{lastSeen=Date.now();if(v.full)return net('القعدة كاملة');net('');update(v)},hello);
 const t0=Date.now();
 setInterval(()=>{hello();if(Date.now()-(lastSeen||t0)>12000)net('مفيش رد من صاحب القعدة. اتأكد من الكود وإن صفحته مفتوحة')},4000);
}

/* الشاشات */
const how=()=>el('details',{},el('summary',{},'إزاي نلعب؟'),el('ul',{},[
 'على التربيزة ٣ كروت بيكوّنوا كلمة، وكل لاعب معاه ٧ كروت.',
 'في دورك غيّر حرف واحد بكارت من إيدك عشان تطلع كلمة جديدة صح.',
 'كل كارت له وشّين: الحرف الصغير فوق على اليمين هو اللي في ضهره، اقلبه لو محتاجه.',
 'كلمة غلط أو الوقت خلص = تسحب كارت.',
 'الجوكر ⭐ بتسحبه من الكروت اللي بره، وينفع يبقى أي حرف.',
 'أول واحد يخلّص كروته يكسب.'].map(t=>el('li',{},t))));
function home(){
 const name=el('input',{maxlength:14,placeholder:'اسمك','aria-label':'اسمك'});name.value=store.get('tr-name')||'';
 const room=el('input',{maxlength:5,placeholder:'كود القعدة','aria-label':'كود القعدة'});room.value=location.hash.slice(1).toUpperCase();
 const go=f=>{const n=name.value.trim();if(!n){name.focus();return net('اكتب اسمك الأول')}store.set('tr-name',n);show(P('لحظة…'));f(n)};
 let saved=null;try{saved=JSON.parse(store.get('kk-room'))}catch(e){}
 show(el('h1',{},'حرف بحرف'),P('غيّر حرف، طلّع كلمة، وخلّص كروتك الأول'),name,
  B('افتح قعدة جديدة',()=>go(n=>host(n))),room,
  B('خش على القعدة',()=>{const c=room.value.trim().toUpperCase();if(c.length!==5)return net('الكود ٥ حروف');go(n=>join(n,c))},'alt'),
  saved&&saved.S&&B('ارجع لقعدتي ('+saved.code+')',()=>go(n=>host(n,saved))),how());
}
function update(v){
 endAt=Date.now()+v.left;
 const j=JSON.stringify({...v,left:0});if(j===last)return;last=j;
 if(!V||V.n!==v.n||V.phase!==v.phase){sel=pos=joker=null}
 V=v;const y=scrollY;render();scrollTo(0,y);
}
setInterval(()=>{const t=document.getElementById('timer');if(t&&V)t.textContent=Math.max(0,Math.ceil((endAt-Date.now())/1000))},200);
const color=l=>'c'+(LETTERS.indexOf(l)%5);
const faces=c=>flipped[c.id]?[c.f[1],c.f[0]]:c.f;
function card(c,props={},letter){
 if(c.joker)return el('button',{type:'button',class:'card joker',...props},el('b',{},letter||'⭐'),el('small',{},'⭐'));
 const [f,b]=faces(c);
 return el('button',{type:'button',class:'card '+color(f),...props,'aria-label':'حرف '+f+' وفي ضهره '+b},el('small',{},b),el('b',{},f));
}
function render(){
 const v=V,isH=v.you===v.host,name=i=>(v.players.find(p=>p.id===i)||{}).n||'لاعب';
 if(v.phase==='lobby'){
  const link=location.protocol.startsWith('http')?location.href.split('#')[0]+'#'+code:null;
  const time=el('select',{'aria-label':'وقت الدور'},[10,15,20,30,45,60].map(n=>el('option',{value:n},'وقت الدور: '+n+' ثانية')));time.value=v.time;
  const dic=el('select',{'aria-label':'نوع الكلمات'},el('option',{value:'1'},'فصحى وعامية مصرية'),el('option',{value:'0'},'فصحى بس'));dic.value=v.egy?'1':'0';
  time.onchange=dic.onchange=()=>send({type:'settings',time:+time.value,egy:dic.value==='1'});
  const n=v.players.filter(p=>p.on).length;
  return show(el('h1',{},'حرف بحرف'),el('div',{class:'box'},P('كود القعدة'),el('div',{class:'code'},code),
   link&&B('انسخ لينك الدعوة',e=>{const b=e.target;navigator.clipboard.writeText(link).then(()=>b.textContent='اتنسخ ✅',()=>b.textContent=link)})),
   el('div',{class:'box'},v.players.map(p=>el('div',{class:'pl'+(p.on?'':' off')},p.n+(p.id===v.you?' (إنت)':'')+(p.id===v.host?' ⭐':'')))),
   isH?[time,dic,B('يلا نلعب',()=>send({type:'start'}),'',n<2),n<2&&P('محتاجين لاعبين على الأقل')]:P(`وقت الدور ${v.time} ثانية · ${v.egy?'فصحى وعامية':'فصحى بس'} · مستنيين صاحب القعدة`),how());
 }
 const list=el('div',{class:'players'},v.players.filter(p=>p.in).map(p=>el('div',{class:'pl'+(p.id===v.turn&&v.phase==='play'?' now':'')+(p.on?'':' off')},`${p.n} · ${p.cards} 🂠`)));
 const table=target=>el('div',{class:'table'},v.word.map((l,i)=>{
  const preview=target&&pos===i&&sel!=null;const c=preview&&v.hand.find(c=>c.id===sel);
  const letter=c?(c.joker?joker||'⭐':faces(c)[0]):l;
  const e=el('button',{type:'button',class:'card big '+(LETTERS.includes(letter)?color(letter):'joker')+(preview?' picked':''),'aria-label':'الخانة '+(i+1)+': '+letter},el('b',{},letter));
  if(target)e.onclick=()=>{pos=i;render()};else e.disabled=true;return e}));
 if(v.phase==='end')return show(el('h1',{},v.winner===v.you?'كسبت! 🏆':name(v.winner)+' كسب 🏆'),P(v.msg),table(false),list,
  isH?B('دور جديد',()=>send({type:'lobby'})):P('مستنيين صاحب القعدة'));
 const mine=v.turn===v.you&&v.hand,c=v.hand&&v.hand.find(c=>c.id===sel);
 const letter=c?(c.joker?joker:faces(c)[0]):null;
 const word=c&&pos!=null&&letter?v.word.map((l,i)=>i===pos?letter:l).join(''):null;
 const same=c&&pos!=null&&letter&&letter===v.word[pos];
 show(list,el('div',{class:'bar'},el('span',{},mine?'دورك!':'دور '+name(v.turn)),el('span',{class:'timer',id:'timer',role:'timer'},Math.ceil((endAt-Date.now())/1000))),
  el('div',{class:'msg',role:'status'},v.msg),v.reject&&B('اقبل «'+v.reject+'» (الكلمة صح)',()=>send({type:'accept'}),'alt'),
  table(!!mine),P('الكروت اللي بره: '+v.deck),
  mine&&P(!c?'١. اختار كارت من إيدك':c.joker&&!joker?'اختار الجوكر يبقى أنهي حرف':pos==null?'٢. دوس على الخانة اللي هتغيّرها':same?'ده نفس الحرف، اختار خانة أو كارت تاني':'٣. الكلمة: '+word),
  c&&c.joker&&el('div',{class:'abc'},LETTERS.map(l=>B(l,()=>{joker=l;render()},joker===l?'on':''))),
  mine&&el('div',{class:'row'},B('العب',()=>{send({type:'play',card:sel,at:pos,side:flipped[sel]?1:0,letter:joker,n:v.n})},'',!word||same),
   B('🔄 اقلب',()=>{flipped[sel]=!flipped[sel];render()},'alt',!c||c.joker),B('اسحب كارت',()=>send({type:'draw',n:v.n}),'ghost')),
  v.hand?el('div',{class:'hand'},v.hand.map(h=>card(h,{class:'card '+(h.joker?'joker':color(faces(h)[0]))+(h.id===sel?' picked':''),
   onclick:()=>{if(sel!==h.id){sel=h.id;joker=null}else if(!h.joker)flipped[h.id]=!flipped[h.id];render()}},h.id===sel&&h.joker?joker:null))):P('الدور شغال، هتدخل من الدور اللي بعده'),
  v.hand&&P('دوس على الكارت المختار تاني عشان تقلبه'),
  isH&&el('div',{class:'row'},B('عدّي الدور',()=>send({type:'skip'}),'ghost'),B('رجوع للقعدة',()=>send({type:'lobby'}),'ghost')));
}
home();
</script>
