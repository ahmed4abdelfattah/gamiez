<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المؤامرة - لعبة الخداع والتحليل السياساتي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#06060f;--bg-secondary:#0d0d1a;--bg-panel:rgba(18,18,40,0.85);
  --green:#00e676;--green-dim:#004d25;--green-glow:rgba(0,230,118,0.3);
  --red:#ff1744;--red-dim:#4d0014;--red-glow:rgba(255,23,68,0.3);
  --gold:#ffd740;--gold-dim:#4d3f00;--gold-glow:rgba(255,215,64,0.3);
  --purple:#7c4dff;--purple-glow:rgba(124,77,255,0.25);
  --text:#f0f0f8;--text-muted:#7a7a9e;--text-dim:#44446a;
  --border:rgba(255,255,255,0.08);--glass:rgba(255,255,255,0.03);
  --radius:16px;--radius-sm:10px;--radius-lg:24px;
  --shadow:0 8px 32px rgba(0,0,0,0.5);
  --transition:all 0.35s cubic-bezier(0.4,0,0.2,1);
}
html,body{height:100dvh;overflow:hidden;font-family:'Tajawal',sans-serif;background:var(--bg-primary);color:var(--text)}
body{display:flex;justify-content:center;align-items:center}
#app{width:100%;max-width:480px;height:100dvh;position:relative;overflow:hidden;display:flex;flex-direction:column}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:16px;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity 0.35s ease,transform 0.35s ease;transform:scale(0.96)}
.screen.active{opacity:1;pointer-events:auto;transform:scale(1)}
.screen-wrapper{margin:auto 0;width:100%;display:flex;flex-direction:column;align-items:center}

/* Background Effects */
#bg-canvas{position:fixed;inset:0;z-index:-1;pointer-events:none}
.bg-glow{position:fixed;border-radius:50%;filter:blur(120px);opacity:0.15;pointer-events:none;z-index:-1}
.bg-glow.g1{width:400px;height:400px;background:var(--purple);top:-100px;right:-100px;animation:floatGlow 12s ease-in-out infinite}
.bg-glow.g2{width:300px;height:300px;background:var(--red);bottom:-50px;left:-80px;animation:floatGlow 15s ease-in-out infinite reverse}
@keyframes floatGlow{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,20px)}}

h1{font-size:2.6rem;font-weight:900;background:linear-gradient(135deg,var(--gold),#fff,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1.2}
h2{font-size:1.5rem;font-weight:700;color:var(--text)}
h3{font-size:1.15rem;font-weight:600;color:var(--text-muted)}
.subtitle{font-size:0.95rem;color:var(--text-muted);margin-top:6px;font-weight:300}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 28px;border:none;border-radius:var(--radius);font-family:'Tajawal',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:var(--transition);position:relative;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent;min-height:48px}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,0.12),transparent);opacity:0;transition:opacity 0.3s}
.btn:hover::before{opacity:1}
.btn:active{transform:scale(0.96)}
.btn-primary{background:linear-gradient(135deg,var(--gold),#ffab00);color:#000;box-shadow:0 4px 20px var(--gold-glow)}
.btn-green{background:linear-gradient(135deg,var(--green),#00c853);color:#000;box-shadow:0 4px 20px var(--green-glow)}
.btn-red{background:linear-gradient(135deg,var(--red),#d50000);color:#fff;box-shadow:0 4px 20px var(--red-glow)}
.btn-ghost{background:var(--glass);border:1px solid var(--border);color:var(--text);backdrop-filter:blur(10px)}
.btn-ghost:hover{border-color:rgba(255,255,255,0.18);background:rgba(255,255,255,0.06)}
.btn-sm{padding:8px 16px;font-size:0.85rem;border-radius:var(--radius-sm);min-height:38px}
.btn-lg{padding:16px 36px;font-size:1.15rem;border-radius:var(--radius-lg);min-height:54px}
.btn-block{width:100%}
.btn:disabled{opacity:0.4;cursor:not-allowed;transform:none!important}

.panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;backdrop-filter:blur(20px);box-shadow:var(--shadow);width:100%}
.input-field{width:100%;padding:12px 16px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'Tajawal',sans-serif;font-size:0.95rem;outline:none;transition:var(--transition);direction:rtl}
.input-field:focus{border-color:var(--gold);box-shadow:0 0 15px var(--gold-glow)}
.input-field::placeholder{color:var(--text-dim)}

/* Modal System */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:999;opacity:0;pointer-events:none;transition:opacity 0.3s ease}
.modal-overlay.active{opacity:1;pointer-events:auto}
.modal-box{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;width:90%;max-width:380px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,0.8);transform:scale(0.9);transition:transform 0.3s ease}
.modal-overlay.active .modal-box{transform:scale(1)}

.score-tracker{display:flex;gap:12px;align-items:center;justify-content:center;width:100%;padding:6px 0}
.score-slots{display:flex;gap:6px}
.score-slot{width:34px;height:34px;border-radius:8px;border:2px solid;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:0.8rem;transition:var(--transition)}
.score-slot.green{border-color:var(--green-dim);color:var(--green-dim);background:rgba(0,230,118,0.03)}
.score-slot.green.filled{background:var(--green);border-color:var(--green);color:#000;box-shadow:0 0 15px var(--green-glow)}
.score-slot.red{border-color:var(--red-dim);color:var(--red-dim);background:rgba(255,23,68,0.03)}
.score-slot.red.filled{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 15px var(--red-glow)}

.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;width:100%}
.player-card{background:var(--glass);border:1px solid var(--border);border-radius:var(--radius);padding:12px 8px;text-align:center;cursor:pointer;transition:var(--transition);position:relative}
.player-card:hover{border-color:rgba(255,255,255,0.15);transform:translateY(-2px)}
.player-card.selected{border-color:var(--gold);box-shadow:0 0 20px var(--gold-glow);background:rgba(255,215,64,0.05)}
.player-card.eliminated{opacity:0.3;pointer-events:none;text-decoration:line-through}
.player-card.is-president{border-color:var(--gold);background:rgba(255,215,64,0.05)}
.player-card.is-president::after{content:'👑';position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:1.1rem}
.player-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--purple),#448aff);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:1.1rem;font-weight:800;color:#fff}
.player-name{font-size:0.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-status{font-size:0.68rem;color:var(--text-muted);margin-top:2px}
.player-green-counter{font-size:0.7rem;color:var(--green);font-weight:700;margin-top:2px}

.role-reveal-card{width:260px;min-height:240px;border-radius:var(--radius-lg);padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:var(--transition)}
.role-reveal-card.role-citizen{background:linear-gradient(145deg,rgba(0,77,37,0.4),rgba(0,200,83,0.1));border:2px solid var(--green);box-shadow:0 0 30px var(--green-glow)}
.role-reveal-card.role-criminal{background:linear-gradient(145deg,rgba(77,0,20,0.4),rgba(255,23,68,0.1));border:2px solid var(--red);box-shadow:0 0 30px var(--red-glow)}
.role-reveal-card.role-assistant{background:linear-gradient(145deg,rgba(77,0,20,0.3),rgba(255,82,82,0.1));border:2px solid #ff5252;box-shadow:0 0 30px rgba(255,82,82,0.3)}
.role-reveal-card.role-imposter{background:linear-gradient(145deg,rgba(124,77,255,0.4),rgba(0,229,255,0.1));border:2px solid var(--purple);box-shadow:0 0 30px var(--purple-glow)}

.known-allies-box{background:rgba(0,0,0,0.4);border:1px solid rgba(255,23,68,0.4);border-radius:var(--radius-sm);padding:10px 14px;width:100%;text-align:center;margin-top:6px}
.known-allies-title{font-size:0.82rem;color:var(--text-muted);margin-bottom:4px}
.known-allies-list{font-size:1.15rem;font-weight:900;color:var(--red)}

.fail-counter{display:flex;gap:6px;align-items:center;justify-content:center}
.fail-dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--text-dim);display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:800;transition:var(--transition)}
.fail-dot.active{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 12px var(--red-glow)}

.toggle-switch{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:var(--text-dim);transition:.3s;border-radius:24px}
.toggle-slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background-color:white;transition:.3s;border-radius:50%}
input:checked + .toggle-slider{background-color:var(--green)}
input:checked + .toggle-slider:before{transform:translateX(20px)}

.setting-item{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--border)}
.setting-header{display:flex;align-items:center;justify-content:space-between}
.setting-title{font-size:0.95rem;font-weight:700;color:var(--text)}
.setting-desc{font-size:0.78rem;color:var(--text-muted);line-height:1.4}

.select-control{width:100%;padding:10px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'Tajawal',sans-serif;font-size:0.9rem;outline:none}

.vote-btn-group{display:flex;gap:12px;width:100%;margin-top:16px}
.vote-btn{flex:1;padding:16px;border-radius:var(--radius-lg);font-size:1.15rem;font-weight:800}
.vote-results{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.vote-chip{padding:6px 12px;border-radius:16px;font-size:0.8rem;font-weight:600;display:flex;align-items:center;gap:4px}
.vote-chip.approve{background:rgba(0,230,118,0.15);color:var(--green);border:1px solid rgba(0,230,118,0.2)}
.vote-chip.reject{background:rgba(255,23,68,0.15);color:var(--red);border:1px solid rgba(255,23,68,0.2)}

.log-toggle{position:fixed;bottom:14px;left:14px;z-index:100;width:42px;height:42px;border-radius:50%;background:var(--bg-panel);border:1px solid var(--border);color:var(--text-muted);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px)}
.log-panel{position:fixed;bottom:0;left:0;right:0;max-height:55vh;background:var(--bg-secondary);border-top:1px solid var(--border);transform:translateY(100%);transition:transform 0.4s ease;z-index:99;overflow-y:auto;padding:16px;border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.log-panel.open{transform:translateY(0)}
.log-entry{padding:6px 10px;border-radius:var(--radius-sm);margin-bottom:6px;font-size:0.8rem;background:rgba(255,255,255,0.02);border:1px solid var(--border)}
.log-entry.log-green{border-right:3px solid var(--green)}
.log-entry.log-red{border-right:3px solid var(--red)}
.log-entry.log-gold{border-right:3px solid var(--gold)}

.win-overlay{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
.win-overlay.citizens-win{background:linear-gradient(180deg,rgba(0,77,37,0.95),rgba(6,6,15,0.98))}
.win-overlay.criminals-win{background:linear-gradient(180deg,rgba(77,0,20,0.95),rgba(6,6,15,0.98))}

.divider{width:80%;height:1px;background:var(--border);margin:14px 0}
.text-center{text-align:center}
.mt-1{margin-top:6px}.mt-2{margin-top:12px}.mt-3{margin-top:20px}
.mb-1{margin-bottom:6px}.mb-2{margin-bottom:12px}
.flex-col{display:flex;flex-direction:column;align-items:center}
.scroll-area{overflow-y:auto;max-height:50vh;width:100%;padding:2px}
.scroll-area::-webkit-scrollbar{width:4px}
.scroll-area::-webkit-scrollbar-thumb{background:var(--text-dim);border-radius:2px}
.hidden{display:none!important}

/* ── أونلاين: الصفحة بتتحرك عادي بدل الشاشات الثابتة ── */
html,body{height:auto;min-height:100dvh;overflow:auto}
body{display:block}
#app{height:auto;min-height:100dvh;overflow:visible;margin:auto;padding:10px 16px 32px}
#view,.stage{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;text-align:center}
.center{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;text-align:center}
.home{color:var(--gold);font-weight:800;text-decoration:none}
#net{color:var(--gold);text-align:center;min-height:1.5em}
.huge{font-size:3.5rem}.code{font-size:2.4rem;font-weight:900;letter-spacing:8px;direction:ltr;color:var(--gold)}
.row{display:flex;gap:10px;width:100%;flex-wrap:wrap;justify-content:center}.row>.btn{flex:1}
.card-btn{padding:20px 8px;font-size:1.3rem}
button.player-card{font-family:inherit;color:var(--text)}button.player-card:disabled{cursor:default}
.player-card.dim{opacity:.35}.off{opacity:.45}
.vote-btn.chosen{outline:3px solid #fff}.vote-chip.wait{border:1px solid var(--border)}
.lbl{font-size:.75rem;color:var(--text-muted)}.lbl.green{color:var(--green)}.lbl.red{color:var(--red)}
.line{display:flex;justify-content:space-between;gap:8px;width:100%;background:var(--glass);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-size:.85rem}
details.panel{padding:12px 16px;text-align:right}summary{cursor:pointer;font-weight:700}
.select-control option{background:#0d0d1a}
</style>
</head>
<body>
<div class="bg-glow g1"></div><div class="bg-glow g2"></div>
<div id="app">
<a class="home" href="index.html">🏠 كل الألعاب</a>
<div id="net" role="status"></div>
<main id="view"></main>
</div>
<template id="settings-tpl">
        <!-- NEW SETTING: EVIL COUNT -->
        <div class="setting-item">
          <div class="setting-header">
            <span class="setting-title">🔪 عدد فريق المجرمين</span>
          </div>
          <select class="select-control" id="opt-evil-count">
            <option value="auto">⚙️ تلقائي (حسب عدد اللاعبين)</option>
            <option value="1">1 (زعيم فقط)</option>
            <option value="2">2 (زعيم + 1 مساعد)</option>
            <option value="3">3 (زعيم + 2 مساعدين)</option>
            <option value="4">4 (زعيم + 3 مساعدين)</option>
            <option value="5">5 (زعيم + 4 مساعدين)</option>
            <option value="6">6 (زعيم + 5 مساعدين)</option>
            <option value="7">7 (زعيم + 6 مساعدين)</option>
          </select>
          <p class="setting-desc">تحديد عدد أفراد فريق المجرمين الإجمالي بدلاً من الاعتماد على التوزيع التلقائي.</p>
        </div>

        <div class="setting-item">
          <div class="setting-header">
            <span class="setting-title">👑 تداول الرئاسة عشوائياً</span>
            <label class="toggle-switch">
              <input type="checkbox" id="opt-random-pres">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <p class="setting-desc">اختر الرئيس القادم عشوائياً من بين الأحياء بدلاً من الدوران الدوري المتسلسل.</p>
        </div>

        <div class="setting-item">
          <div class="setting-header">
            <span class="setting-title">🗳️ طريقة التصويت</span>
          </div>
          <select class="select-control" id="opt-voting-mode">
            <option value="secret">🔐 تصويت سري (مخفي حتى النتيجة)</option>
            <option value="public">📢 تصويت علني مباشر</option>
          </select>
          <p class="setting-desc">اختر ما إذا كانت الأصوات تظهر للجميع لحظيًا أم تبقى مخفية حتى يصوت الكل.</p>
        </div>

        <div class="setting-item">
          <div class="setting-header">
            <span class="setting-title">⭐ صوت مضاعف لداعم المواطنين</span>
            <label class="toggle-switch">
              <input type="checkbox" id="opt-mvp-voter">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <p class="setting-desc">اللاعب الذي ساهم بـ 3 بطاقات خضراء فأكثر كمستشار يحصل صوته على قوة مضاعفة (صوتان) في التصويت.</p>
        </div>

        <div class="setting-item">
          <div class="setting-header">
            <span class="setting-title">🔄 إعادة انتخاب الحكومة السابقة</span>
          </div>
          <select class="select-control" id="opt-term-restriction">
            <option value="auto">⚙️ قياسية (حسب عدد اللاعبين)</option>
            <option value="none">🔓 السماح للجميع (إلغاء الحظر)</option>
            <option value="chancellor">🛑 حظر المستشار السابق فقط</option>
            <option value="president">👑 حظر الرئيس السابق فقط</option>
            <option value="both">⛔ حظر الرئيس والمستشار السابقين</option>
          </select>
          <p class="setting-desc">تحديد قيود اختيار المستشار الجديد بالنسبة لأعضاء الحكومة السابقة مباشرة.</p>
        </div>

        <div class="setting-item">
          <div class="setting-header">
            <span class="setting-title">👁️ كشف المستقبل عند 3 كروت خضراء</span>
            <label class="toggle-switch">
              <input type="checkbox" id="opt-peek-deck">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <p class="setting-desc">يستطيع الرئيس الاطلاع سرًا على ألوان البطاقات الثلاث القادمة بمجرد الوصول لـ 3 بطاقات خضراء.</p>
        </div>

        <div class="setting-item">
          <div class="setting-header">
            <span class="setting-title">🎲 التشكيل العشوائي للحكومة</span>
            <label class="toggle-switch">
              <input type="checkbox" id="opt-random-gov">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <p class="setting-desc">يتم اختيار المستشار عشوائيًا من الخيارات المتاحة تلقائيًا دون اختيار يدوي من الرئيس.</p>
        </div>

        <div class="setting-item">
          <div class="setting-header">
            <span class="setting-title">👑 فوز كبير المجرمين بالانتخاب</span>
            <label class="toggle-switch">
              <input type="checkbox" id="opt-master-election-win">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <p class="setting-desc">إذا تم انتخاب كبير المجرمين مستشارًا بعد إقرار 3 بطاقات حمراء يفوز المجرمون فورًا.</p>
        </div>

        <div class="setting-item">
          <div class="setting-header">
            <span class="setting-title">🎭 شخصية المحتال (Imposter)</span>
            <label class="toggle-switch">
              <input type="checkbox" id="opt-imposter-role">
              <span class="toggle-slider"></span>
            </label>
          </div>
          <p class="setting-desc">شخصية مستقلة هدفها تضليل الجميع، وشرط فوزها الوحيد هو البقاء حية حتى نهاية اللعبة.</p>
        </div>
      </template>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
<script>
const BROKER=window.TEST_BROKER||'wss://broker.emqx.io:8084/mqtt', PREFIX='muamara-t6j1/';
const CONFIG={
 roles:{5:[3,1],6:[4,1],7:[4,2],8:[5,2],9:[5,3],10:[6,3],11:[6,4],12:[7,4],13:[8,4],14:[8,5],15:[9,5],16:[10,5]}, /* [مواطنين، مساعدين] + مجرم */
 cards:n=>n<=8?{red:11,green:6}:n<=10?{red:13,green:6}:n<=12?{red:15,green:6}:{red:17,green:7},
 term:n=>n<=8?'chancellor':n<=11?'both':'two_governments',
 powers:{2:'investigate',3:'pick_president',4:'execute',5:'execute'}};
const DEFAULTS={votingMode:'secret',mvpVoter:false,termRestriction:'auto',peekDeckOn3Green:false,randomGovernment:false,randomPresident:false,masterElectionWin:false,imposterRole:false,customEvilCount:'auto'};

const Sound={ctx:null,
 init(){try{if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)();if(this.ctx.state==='suspended')this.ctx.resume()}catch(e){}},
 play(type){const T={click:[[800,.05]],reveal:[[400,.05],[800,.1]],vote:[[600,.08],[900,.1]],card:[[500,.06]],greenCard:[[523,.08],[784,.12]],redCard:[[200,.25]],execute:[[100,.4]],victory:[[523,.18],[659,.18],[784,.18],[1047,.18]]}[type];
  if(!this.ctx||!T)return;try{T.forEach(([f,d],i)=>{const t=this.ctx.currentTime+i*.11,o=this.ctx.createOscillator(),g=this.ctx.createGain();o.frequency.value=f;if(f<=200)o.type='sawtooth';g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(this.ctx.destination);o.start(t);o.stop(t+d)})}catch(e){}}};

const B=(t,f,c='btn-primary',off=false)=>{const b=el('button',{type:'button',class:'btn '+c,onclick:()=>{Sound.play('click');f(b)}},t);b.disabled=off;return b};

const net=t=>$('net').textContent=t;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

/* الاتصال */
function connect(topic,onMsg,onReady){
 if(typeof mqtt==='undefined')return net('تعذر تحميل مكتبة الاتصال، تأكد من الإنترنت وحدّث الصفحة');
 net('جاري الاتصال…');
 client=mqtt.connect(BROKER,{clientId:'mu_'+me+rid(),reconnectPeriod:2000});
 client.on('connect',()=>{net('');client.subscribe(topic,onReady)});
 client.on('message',(t,m)=>{try{onMsg(JSON.parse(m.toString()))}catch(e){console.error(e)}});
 client.on('reconnect',()=>net('جاري إعادة الاتصال…'));
}
const pub=(t,d)=>client&&client.publish(PREFIX+code+'/'+t,JSON.stringify(d));
const send=a=>{a.id=me;if(V&&V.g)a.step=V.g.step;isHost?handle(a):pub('up',a)};

/* ───────── منطق اللعبة (على جهاز صاحب الغرفة) ───────── */
const online=u=>u===me||Date.now()-S.m[u].seen<15000;
const alive=()=>S.g.players.filter(p=>p.alive);
const nameOf=i=>S.g.players[i].name;
const log=(t,type='neutral')=>S.g.log.push({t,type});
function go(phase){S.g.phase=phase;S.g.step++}
function startGame(){
 const ids=S.order.filter(online).slice(0,16),n=ids.length;if(n<5)return;
 const o=S.settings;let[cit,asst]=CONFIG.roles[n];
 if(o.customEvilCount!=='auto'){const e=Math.min(+o.customEvilCount,n-1);asst=e-1;cit=n-e}
 const roles=['criminal',...Array(asst).fill('assistant'),...Array(cit).fill('citizen')];
 if(o.imposterRole&&cit>1)roles[roles.indexOf('citizen')]='imposter';
 shuffle(roles);
 const c=CONFIG.cards(n);
 S.g={opt:{...o},n,players:ids.map((u,i)=>({u,name:S.m[u].n,role:roles[i],alive:true,investigated:false,green:0})),
  deck:shuffle([...Array(c.red).fill('red'),...Array(c.green).fill('green')]),discard:[],green:0,red:0,pres:-1,chan:-1,lastPres:-1,lastChan:-1,govs:[],fail:0,round:0,special:-1,
  votes:{},drawn:[],hand:[],peeked:false,used:{},ready:{},log:[],step:S.step0=(S.step0||0)+1000,phase:'roles',result:null,info:null};
 log('🎮 بدأت اللعبة!','gold');
}
function nextPresident(){
 const g=S.g;g.round++;
 if(g.special>=0&&g.players[g.special].alive)g.pres=g.special;
 else if(g.opt.randomPresident){const o=alive().map(p=>g.players.indexOf(p)).filter(i=>i!==g.pres);g.pres=o[Math.random()*o.length|0]}
 else{do g.pres=(g.pres+1)%g.n;while(!g.players[g.pres].alive)}
 g.special=-1;g.chan=-1;g.info=null;g.result=null;
 log(`👑 ${nameOf(g.pres)} أصبح الرئيس`,'gold');
 go('nominate');
 if(g.opt.randomGovernment){const e=eligible();if(e.length)nominate(e[Math.random()*e.length|0])}
}
function eligible(){
 const g=S.g,bad=new Set();
 const term=g.opt.termRestriction==='auto'?CONFIG.term(g.n):g.opt.termRestriction;
 if(term==='chancellor'||term==='both')bad.add(g.lastChan);
 if(term==='president'||term==='both')bad.add(g.lastPres);
 if(term==='two_governments')g.govs.slice(-2).forEach(x=>{bad.add(x.pres);bad.add(x.chan)});
 const all=g.players.map((p,i)=>i).filter(i=>g.players[i].alive&&i!==g.pres);
 const ok=all.filter(i=>!bad.has(i));return ok.length?ok:all;
}
function nominate(i){const g=S.g;g.chan=i;g.votes={};log(`🤝 ${nameOf(g.pres)} اختار ${nameOf(i)} مستشارًا`,'gold');go('vote')}
function mvp(){const g=S.g;if(!g.opt.mvpVoter)return -1;let m=2,at=-1;g.players.forEach((p,i)=>{if(p.green>m){m=p.green;at=i}});return at}
function tally(){
 const g=S.g,m=mvp();let yes=0,no=0;const list=[];
 g.players.forEach((p,i)=>{if(!p.alive||!(i in g.votes))return;const w=i===m?2:1;g.votes[i]?yes+=w:no+=w;list.push({i,v:g.votes[i],x2:w===2})});
 if(!list.length)return;
 const tie=yes===no,ok=tie?Math.random()>.5:yes>no;
 g.result={yes,no,tie,ok,list};
 log(`🗳️ النتيجة: ${yes} موافق / ${no} رافض ← ${ok?'تمت الموافقة':'تم الرفض'}${tie?' (حُسمت عشوائيًا بسبب التعادل)':''}`,ok?'green':'red');
 go('voteResult');
}
function refill(){const g=S.g;if(g.deck.length<3){g.deck=shuffle(g.deck.concat(g.discard));g.discard=[];log('🔄 تم خلط الكومة من جديد')}}
function afterVote(){
 const g=S.g;
 if(g.result.ok){
  g.fail=0;g.lastPres=g.pres;g.lastChan=g.chan;g.govs.push({pres:g.pres,chan:g.chan});
  if(g.opt.masterElectionWin&&g.red>=3&&g.players[g.chan].role==='criminal')return end('criminals','تم انتخاب المجرم الأساسي مستشارًا بعد إقرار 3 بطاقات حمراء! 🔴');
  refill();g.drawn=g.deck.splice(0,3);return go('presCards');
 }
 g.fail++;log(`⚠️ عداد الفشل: ${g.fail}/2`,'red');
 if(g.fail<2)return nextPresident();
 /* فوضى: بطاقة حمراء من غير قدرات رئاسية */
 g.fail=0;g.red++;
 log('🔴 فشل التصويت مرتين! بطاقة حمراء تلقائية (فوضى)','red');go('chaos');
}
function win(){
 const g=S.g;
 if(g.green>=5){end('citizens','تم تمرير 5 بطاقات خضراء! 🟢');return true}
 if(g.red>=6){end('criminals','تم تمرير 6 بطاقات حمراء! 🔴');return true}
 return false;
}
function end(winner,reason){const g=S.g;g.info={winner,reason};log(`🏆 ${winner==='citizens'?'المواطنون فازوا!':'المجرمون فازوا!'} - ${reason}`,winner==='citizens'?'green':'red');go('over')}
function targets(power){const g=S.g;return g.players.map((p,i)=>i).filter(i=>g.players[i].alive&&i!==g.pres&&(power!=='investigate'||!g.players[i].investigated))}
function startPower(){
 const g=S.g,p=CONFIG.powers[g.red];
 if(!p||g.used[g.red]||!targets(p).length)return nextPresident();
 g.used[g.red]=true;g.info={power:p};log(`⚡ قدرة خاصة: ${POWER[p][0]}`,'gold');go('power');
}
function afterCard(){
 const g=S.g;if(win())return;
 if(g.opt.peekDeckOn3Green&&g.green===3&&!g.peeked){g.peeked=true;refill();g.info={peek:g.deck.slice(0,3)};log('👁️ الرئيس تفقّد البطاقات الثلاث القادمة','gold');return go('peek')}
 startPower();
}
/* "متابعة" من شاشات النتائج */
function proceed(){
 const g=S.g;
 ({voteResult:afterVote,chaos:()=>{if(!win())nextPresident()},played:afterCard,peek:startPower,powerDone:nextPresident}[g.phase]||(()=>{}))();
}
function handle(a){
 if(!S||typeof a.id!=='string'||!/^[a-z0-9]{4,12}$/.test(a.id))return;
 let m=S.m[a.id];const host=a.id===me;
 if(a.type==='hello'){
  let name=String(a.name||'').trim().slice(0,12)||'لاعب';
  if(!m){
   if(S.order.length>=16){const gone=S.order.find(u=>!online(u)&&!(S.g&&S.g.players.some(p=>p.u===u)));
    if(!gone)return pub('to/'+a.id,{full:true});S.order=S.order.filter(u=>u!==gone);delete S.m[gone]}
   const base=name;for(let n=2;S.order.some(u=>S.m[u].n===name);n++)name=base+' '+n;
   m=S.m[a.id]={n:name};S.order.push(a.id);
  }
 }
 if(!m)return;m.seen=Date.now();
 if(host&&!S.g){
  if(a.type==='settings'){for(const k in DEFAULTS){const v=a.v&&a.v[k];if(typeof v===typeof DEFAULTS[k])S.settings[k]=v}}
  if(a.type==='start')startGame();
 }
 const g=S.g;
 if(g&&a.type!=='hello'){
  if(host&&a.type==='lobby'){S.g=null;return sync()}
  const s=g.players.findIndex(p=>p.u===a.id),pres=s===g.pres&&s>=0,fresh=a.step===g.step,i=a.i;
  if(g.phase==='roles'){
   if(a.type==='ready'&&s>=0)g.ready[s]=true;
   if((host&&a.type==='force'&&fresh)||g.players.every((p,k)=>g.ready[k]))nextPresident();
  }else if(fresh){
   if(g.phase==='nominate'&&a.type==='nominate'&&pres&&eligible().includes(i))nominate(i);
   else if(g.phase==='vote'&&a.type==='vote'&&s>=0&&g.players[s].alive&&typeof a.v==='boolean'){
    /* التصويت السري نهائي، والعلني ينفع يتغير لحد آخر صوت */
    if(g.opt.votingMode==='public'||!(s in g.votes))g.votes[s]=a.v;
    if(g.players.every((p,k)=>!p.alive||k in g.votes))tally()}
   else if(g.phase==='vote'&&a.type==='force'&&host)tally();
   else if(g.phase==='presCards'&&a.type==='discard'&&pres&&[0,1,2].includes(i)){g.discard.push(g.drawn[i]);g.hand=g.drawn.filter((_,k)=>k!==i);g.drawn=[];log('👑 الرئيس تخلص من بطاقة سرًا');go('chanCards')}
   else if(g.phase==='chanCards'&&a.type==='play'&&s===g.chan&&[0,1].includes(i)){
    const c=g.hand[i];g.discard.push(g.hand[1-i]);g.hand=[];g.last=c;
    if(c==='green'){g.green++;g.players[g.chan].green++}else g.red++;
    log(c==='green'?'🟢 تم تمرير بطاقة خضراء!':'🔴 تم تمرير بطاقة حمراء!',c);go('played')}
   else if(g.phase==='power'&&a.type==='target'&&pres&&targets(g.info.power).includes(i)){
    const t=g.players[i],p=g.info.power;
    if(p==='investigate'){t.investigated=true;g.info={power:p,i,citizen:t.role==='citizen'||t.role==='imposter'};log(`🔍 الرئيس حقق مع ${t.name}`,'gold');go('powerDone')}
    else if(p==='pick_president'){g.special=i;g.info={power:p,i};log(`🎯 الرئيس اختار ${t.name} ليكون الرئيس القادم`,'gold');go('powerDone')}
    else{t.alive=false;g.info={power:p,i};log(`⚔️ تم إقصاء ${t.name} من اللعبة!`,'red');t.role==='criminal'?end('citizens','تم إقصاء المجرم الأساسي! ⚔️'):go('powerDone')}}
   else if(a.type==='next'&&(host||pres))proceed();
   else if(a.type==='cancel'&&host&&['nominate','vote','presCards','chanCards','power'].includes(g.phase)){
    g.discard.push(...g.drawn,...g.hand);g.drawn=[];g.hand=[];log('⏭️ صاحب الغرفة تخطى دور الحكومة الحالية');nextPresident()}
  }
 }
 sync();
}
/* كل لاعب يستقبل المعلومات المسموح له يشوفها بس */
function viewFor(u){
 const base={you:u,isHost:u===me,settings:S.settings,members:S.order.map(x=>({n:S.m[x].n,on:online(x),me:x===u,host:x===me}))};
 const g=S.g;if(!g)return base;
 const s=g.players.findIndex(p=>p.u===u),mine=g.players[s],over=g.phase==='over',pres=s>=0&&s===g.pres,ph=g.phase;
 const evil=g.players.map((p,i)=>i).filter(i=>['criminal','assistant'].includes(g.players[i].role));
 const showVotes=ph==='vote'&&g.opt.votingMode==='public';
 return {...base,g:{step:g.step,phase:ph,round:g.round,green:g.green,red:g.red,fail:g.fail,pres:g.pres,chan:g.chan,seat:s,mode:g.opt.votingMode,mvp:mvp(),log:g.log.slice(-40),last:g.last,
  players:g.players.map((p,i)=>({name:p.name,alive:p.alive,green:p.green,on:online(p.u),role:over?p.role:null,
   voted:ph==='vote'?i in g.votes:ph==='roles'?!!g.ready[i]:false,vote:showVotes&&i in g.votes?g.votes[i]:null})),
  role:mine?mine.role:null,
  allies:mine&&evil.includes(s)?evil.filter(i=>i!==s).map(i=>({name:g.players[i].name,boss:g.players[i].role==='criminal'})):[],
  myVote:ph==='vote'&&s in g.votes?g.votes[s]:null,
  result:ph==='voteResult'?g.result:null,
  eligible:ph==='nominate'?eligible():null,
  cards:ph==='presCards'&&pres?g.drawn:ph==='chanCards'&&s===g.chan?g.hand:null,
  peek:ph==='peek'&&pres?g.info.peek:null,
  targets:ph==='power'&&pres?targets(g.info.power):null,
  info:over?g.info:ph==='power'?{power:g.info.power}:ph==='powerDone'?{power:g.info.power,i:g.info.i,citizen:pres?g.info.citizen:undefined}:null}};
}
function sync(){
 store.set('mu-room',JSON.stringify({code,S}));
 S.order.forEach(u=>{if(u!==me)pub('to/'+u,viewFor(u))});
 update(viewFor(me));
}
function host(name,saved){
 isHost=true;
 if(saved){code=saved.code;S=saved.S}
 else{code=Array.from({length:5},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.random()*31|0]).join('');
  let o={};try{o=JSON.parse(store.get('al_muamara_settings'))||{}}catch(e){}
  S={m:{},order:[],g:null,settings:{...DEFAULTS,...o}}}
 connect(PREFIX+code+'/up',handle,()=>handle({type:'hello',id:me,name}));
 setInterval(()=>{if(S.m[me]){S.m[me].seen=Date.now();sync()}},4000);
}
function join(name,c){
 code=c;const hello=()=>pub('up',{type:'hello',id:me,name});
 connect(PREFIX+code+'/to/'+me,v=>{lastSeen=Date.now();if(v.full)return net('الغرفة ممتلئة (16 لاعبًا)');net('');update(v)},hello);
 const t0=Date.now();
 setInterval(()=>{hello();if(Date.now()-(lastSeen||t0)>12000)net('لا يوجد رد من صاحب الغرفة. تأكد من الكود وأن صفحته مفتوحة')},4000);
}

  if(g)Sound.play({vote:'reveal',voteResult:'vote',presCards:'card',chanCards:'card',played:g.last==='green'?'greenCard':'redCard',chaos:'redCard',power:'reveal',over:'victory',powerDone:g.info&&g.info.power==='execute'?'execute':'click'}[g.phase])}

  send({type:'settings',v:{votingMode:any(['secret','public']),mvpVoter:r(),termRestriction:any(['auto','none','chancellor','president','both']),peekDeckOn3Green:r(),randomGovernment:r(),randomPresident:r(),masterElectionWin:r(),imposterRole:r(),customEvilCount:'auto'}})},'btn-ghost btn-sm'));

function render(){
 const v=V,g=v.g,H=v.isHost;
